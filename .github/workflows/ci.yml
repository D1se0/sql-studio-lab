name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas sin MySQL
        run: python3 app/tests/test_unit.py

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: TypeScript + build
        run: npm run build

  scripts:
    name: Scripts de shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Comprobar sintaxis
        run: |
          for file in install.sh sql-lab sql-studio; do
            bash -n "$file"
          done
      - name: Comprobar el compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm -f .env
