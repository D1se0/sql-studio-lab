services:
  mysql:
    image: mysql:8.4
    container_name: sql-lab
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./volumen:/var/lib/mysql
      - ./sql:/lab/sql:ro
      - ./historial:/lab/historial
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
